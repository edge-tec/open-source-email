
services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    image: edgemail-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=db
      - REDIS_HOST=redis
    depends_on:
      - db
      - redis
    networks:
      - edgemail-net

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - edgemail-net

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-edgemail}
      MYSQL_USER: ${DB_USERNAME:-edgemail}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - edgemail-net

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - edgemail-net

  mail:
    image: mailserver/docker-mailserver:latest
    restart: unless-stopped
    hostname: mail.${DOMAIN:-example.com}
    container_name: edgemail-mailserver
    ports:
      - "25:25"    # SMTP
      - "143:143"  # IMAP
      - "465:465"  # SMTPS
      - "587:587"  # Submission
      - "993:993"  # IMAPS
    volumes:
      - mail-data:/var/mail
      - mail-state:/var/mail-state
      - mail-logs:/var/log/mail
      - ./docker/mailserver/config:/tmp/docker-mailserver
      - ./docker/mailserver/letsencrypt:/etc/letsencrypt
      - /etc/localtime:/etc/localtime:ro
    environment:
      - ENABLE_SPAMASSASSIN=1
      - SPAMASSASSIN_SPAM_TO_INBOX=1
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=1
      - ENABLE_POSTGREY=0
      - ONE_DIR=1
      - PERMIT_DOCKER=network
      - SSL_TYPE=letsencrypt
    networks:
      - edgemail-net

volumes:
  db-data:
  redis-data:
  storage-data:
  mail-data:
  mail-state:
  mail-logs:

networks:
  edgemail-net:
    driver: bridge
